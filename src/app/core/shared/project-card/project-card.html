<a
  class="project-card"
  [href]="language.localizedUrl('/portfolio/' + project().id)"
  (click)="openProject($event)"
>
  <img
    [ngSrc]="image()"
    [priority]="priority()"
    [alt]="'projects-page.projects.' + project().id + '.title' | translate"
    class="project-card__image"
    width="640"
    height="360"
    decoding="async"
  />
  <div class="project-card__container">
    <!-- One level below the heading of the section the card sits in. -->
    @if (headingLevel() === 2) {
      <h2 class="project-card__title">
        {{ "projects-page.projects." + project().id + ".title" | translate }}
      </h2>
    } @else {
      <h3 class="project-card__title">
        {{ "projects-page.projects." + project().id + ".title" | translate }}
      </h3>
    }
    <p class="project-card__description">
      {{
        "projects-page.projects." + project().id + ".shortDescription"
          | translate
      }}
    </p>
  </div>
</a>
