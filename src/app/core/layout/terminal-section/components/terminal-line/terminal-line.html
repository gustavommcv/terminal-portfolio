<div
  class="terminal-line"
  aria-live="off"
  [style.--terminal-cursor-blink-interval]="cursorBlinkIntervalMs() + 'ms'"
>
  <!--
    The typed text is only partly there while it animates, so assistive
    technology gets the complete command as plain text instead.
  -->
  @if (accessibleLabel(); as label) {
    <span class="visually-hidden">{{ label }}</span>
  }

  <span class="prompt-container" [attr.aria-hidden]="accessibleLabel() ? 'true' : null">
    @if (!short()) {
      <span class="user-host">[{{ username }}{{ hostname }} </span>
    }
    <span class="path">{{ path }}</span>
    @if (!short()) {
      <span>]</span>
    }
    <span class="prompt">{{ prompt }} </span>
  </span>

  <span
    class="command-container"
    [attr.aria-hidden]="accessibleLabel() ? 'true' : null"
  >
    <span class="command" [class.command--error]="error()">{{ command() }}</span>
    @if (showCursor()) {
      <span
        class="terminal-cursor"
        [class.terminal-cursor--static]="!animateCursor()"
        aria-hidden="true"
      ></span>
    }
  </span>
</div>
