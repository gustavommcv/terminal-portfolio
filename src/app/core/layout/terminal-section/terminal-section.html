<div class="terminal-section-container">
  @if (isFirstTitle()) {
    <h1 class="terminal-section__title">{{ customTitle() }}</h1>
  } @else {
    <h2 class="terminal-section__title">{{ customTitle() }}</h2>
  }

  <section class="terminal-section">
    <div
      class="terminal-section__layout-reservation"
      aria-hidden="true"
      inert
    >
      <ng-content select="[terminalLayoutReservation]" />
    </div>

    <div class="terminal-section__visible-content">
      <app-terminal-line
        [short]="shortTerminalLine()"
        [command]="customCommand()"
        [accessibleCommand]="accessibleCommand()"
        [showCursor]="showCursor()"
        [cursorBlinkIntervalMs]="cursorBlinkIntervalMs()"
        [error]="errorCommand()"
      />
      <ng-content />
    </div>
  </section>
</div>
