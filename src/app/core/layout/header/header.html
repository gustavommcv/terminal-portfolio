<header class="header">
  <div class="header__top">
    <a
      [href]="language.localizedUrl('/')"
      (click)="navigateWithLocale('/', $event)"
      class="logo"
      aria-label="gus::monnerat — home"
    >
      <span class="logo--left">gus</span>
      <span class="logo--middle">::</span>
      <span class="logo--right">monnerat</span>
    </a>

    <button
      #menuTrigger
      type="button"
      class="hamburger-button"
      (click)="toggleMenu()"
      aria-label="Menu"
      aria-controls="mobile-menu"
      [attr.aria-expanded]="isMenuOpen()"
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </div>

  @if (isMenuOpen()) {
    <div id="mobile-menu" class="menu-overlay" (click)="closeMenu()">
      <nav
        class="mobile-nav"
        aria-label="Mobile"
        (click)="$event.stopPropagation()"
      >
        <div class="nav-links">
          @for (
            route of ['/', '/about', '/portfolio'];
            track route
          ) {
            <a
              class="mobile-nav__link"
              [class.mobile-nav__link--active]="isActive(route)"
              [attr.aria-current]="isActive(route) ? 'page' : null"
              [href]="language.localizedUrl(route)"
              (click)="navigateWithLocale(route, $event, true)"
            >{{ route === '/' ? 'home' : route.slice(1) }}</a>
          }
        </div>

        <div class="language-toggle-container">
          <language-toggle-button />
        </div>
      </nav>
    </div>
  }

  <nav class="header__nav desktop-nav" aria-label="Primary">
    @for (route of ['/', '/about', '/portfolio']; track route) {
      <a
        class="header__link"
        [class.header__link--active]="isActive(route)"
        [attr.aria-current]="isActive(route) ? 'page' : null"
        [href]="language.localizedUrl(route)"
        (click)="navigateWithLocale(route, $event)"
      >{{ route === '/' ? 'home' : route.slice(1) }}</a>
    }

    <div class="desktop-language-toggle">
      <language-toggle-button />
    </div>
  </nav>
</header>
