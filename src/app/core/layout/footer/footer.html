<footer class="footer">
  <div class="footer__content">
    <!-- Kept in English on purpose, in every language. -->
    <p class="footer__copyright" lang="en">
      &copy; <span class="footer__year">{{ currentYear }}</span> Made with
      <span class="footer__heart" role="img" aria-label="love"> ♥ </span>
      by <span class="footer__author">Gustavo Monnerat</span>
    </p>

    <p class="footer__theme-credit">
      {{ "footer.theme-before" | translate }}
      <a
        href="https://github.com/EdenEast/nightfox.nvim"
        class="footer__link"
        target="_blank"
        rel="noopener noreferrer"
      >
        NightFox
      </a>
      {{ "footer.theme-after" | translate }}
    </p>
  </div>
</footer>
