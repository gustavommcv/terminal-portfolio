<div class="error-page">
  <app-terminal-section
    [customTitle]="'error-page.title' | translate"
    [shortTerminalLine]="true"
    [customCommand]="currentPath"
    [errorCommand]="true"
  >
    <div class="not-found">
      <h2 class="not-found__title">
        {{ "error-page.heading" | translate }}
      </h2>

      <p class="not-found__output">
        {{ "error-page.message" | translate: { path: currentPath } }}
      </p>
    </div>
  </app-terminal-section>
</div>
