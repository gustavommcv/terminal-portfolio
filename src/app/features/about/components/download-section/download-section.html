<div class="download-section">
  <app-terminal-section
    [customTitle]="'about-page.download-section.heading' | translate"
    customCommand="glow cv.md"
    [shortTerminalLine]="true"
  >
    <app-title [title]="'about-page.download-section.title' | translate" />

    <div class="download-section__warning">
      {{ "about-page.download-section.warning" | translate }}
    </div>

    @if (hasOverflow()) {
      <div class="download-section__warning download-section__warning--2">
        {{ "about-page.download-section.warning2" | translate }}
      </div>
    }

    <div class="download-section__container" #scrollContainer>
      <div class="download-section__element">
        <h3 class="download-section__title">CV DOCX</h3>
        <button
          class="download-section__button"
          [attr.aria-label]="
            'about-page.download-section.button-label'
              | translate: { format: 'DOCX' }
          "
          (click)="downloadCV('docx')"
        >
          <span class="download-section__button-text">{{
              "about-page.download-section.button" | translate
            }}</span>
        </button>
      </div>

      <div class="download-section__element">
        <h3 class="download-section__title">CV ODT</h3>
        <button
          class="download-section__button"
          [attr.aria-label]="
            'about-page.download-section.button-label'
              | translate: { format: 'ODT' }
          "
          (click)="downloadCV('odt')"
        >
          <span class="download-section__button-text">{{
              "about-page.download-section.button" | translate
            }}</span>
        </button>
      </div>

      <div class="download-section__element">
        <h3 class="download-section__title">CV PDF</h3>
        <button
          class="download-section__button"
          [attr.aria-label]="
            'about-page.download-section.button-label'
              | translate: { format: 'PDF' }
          "
          (click)="downloadCV('pdf')"
        >
          <span class="download-section__button-text">{{
              "about-page.download-section.button" | translate
            }}</span>
        </button>
      </div>
    </div>
  </app-terminal-section>
</div>
