<div class="portfolio-page">
  <app-terminal-section
    [customTitle]="'projects-page.title' | translate"
    customCommand="glow portfolio.md"
    [shortTerminalLine]="true"
    [isFirstTitle]="true"
  >
    <app-title [title]="'projects-page.title' | translate" />

    <div
      class="project-filters"
      role="group"
      [attr.aria-label]="'projects-page.filters.label' | translate"
    >
      @for (filter of filters; track filter.id) {
        <button
          type="button"
          class="project-filters__button"
          [attr.aria-pressed]="selectedFilter() === filter.id"
          (click)="selectedFilter.set(filter.id)"
        >
          {{ 'projects-page.filters.' + filter.id | translate }}
          <span class="project-filters__count">{{ filter.count }}</span>
        </button>
      }
    </div>
    <p class="portfolio-page__results" role="status" aria-live="polite" aria-atomic="true">
      {{ 'projects-page.filters.results' | translate: { shown: visibleProjects().length, total: projectsData.length } }}
    </p>

    <div class="projects-container">
      <!-- Image loading priority is fixed at creation; a filter gets its own first row. -->
      @for (entry of visibleProjects(); track entry.key; let index = $index) {
        <app-project-card
          [project]="entry.project"
          [headingLevel]="2"
          [priority]="index < aboveTheFold"
        ></app-project-card>
      }
    </div>
  </app-terminal-section>
</div>
