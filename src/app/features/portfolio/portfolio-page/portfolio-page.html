<!-- Projects count -->
<div class="portfolio-page">
  <app-terminal-section
    [customTitle]="'projects-page.title' | translate"
    customCommand="glow portfolio.md"
    [shortTerminalLine]="true"
    [isFirstTitle]="true"
  >
    <app-title [title]="'projects-page.title' | translate" />

    <div class="projects-container">
      @for (project of projectsData; track project.id; let index = $index) {
        <app-project-card
          [project]="project"
          [headingLevel]="2"
          [priority]="index < aboveTheFold"
        ></app-project-card>
      }
    </div>
  </app-terminal-section>
</div>
