<div class="project-gallery__frame">
  <button
    type="button"
    class="project-gallery__expand"
    [attr.aria-label]="'projects-page.gallery.expand' | translate"
    (click)="openLightbox()"
  >
    <img
      [ngSrc]="image()"
      priority
      [alt]="alt()"
      class="project-gallery__thumbnail"
      width="640"
      height="360"
      decoding="async"
    />
    <svg
      class="project-gallery__expand-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
      focusable="false"
    >
      <path
        d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</div>

@if (images().length > 1) {
  <div
    class="project-gallery__thumbs"
    role="group"
    [attr.aria-label]="'projects-page.gallery.label' | translate"
  >
    @for (src of images(); track src; let i = $index) {
      <button
        type="button"
        class="project-gallery__thumb"
        [class.project-gallery__thumb--active]="i === selectedIndex()"
        [attr.aria-pressed]="i === selectedIndex()"
        [attr.aria-label]="
          'projects-page.gallery.show'
            | translate: { number: i + 1, total: images().length }
        "
        (click)="select(i)"
      >
        <img [ngSrc]="src" alt="" width="160" height="90" decoding="async" />
      </button>
    }
  </div>
}

<!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -- clicking the backdrop is a mouse convenience; the keyboard has the native Escape and the close button -->
<dialog
  #lightbox
  class="project-gallery__lightbox"
  [attr.aria-label]="alt()"
  (click)="onLightboxClick($event)"
  (keydown)="onLightboxKeydown($event)"
>
  <div class="project-gallery__lightbox-stage">
    <!-- eslint-disable @angular-eslint/template/prefer-ngsrc -- it fills the dialog at whatever size the screen allows, so it has no fixed width and height -->
    <img [src]="image()" [alt]="alt()" class="project-gallery__lightbox-image" />
    <!-- eslint-enable @angular-eslint/template/prefer-ngsrc -->
  </div>

  <button
    type="button"
    class="project-gallery__lightbox-button project-gallery__lightbox-close"
    [attr.aria-label]="'projects-page.gallery.close' | translate"
    (click)="closeLightbox()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path
        d="M6 6l12 12M18 6L6 18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />
    </svg>
  </button>

  @if (images().length > 1) {
    <div class="project-gallery__lightbox-controls">
      <button
        type="button"
        class="project-gallery__lightbox-button project-gallery__lightbox-prev"
        [attr.aria-label]="'projects-page.gallery.previous' | translate"
        (click)="previous()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M15 5l-7 7 7 7"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <p class="project-gallery__lightbox-count" aria-live="polite">
        {{ selectedIndex() + 1 }} / {{ images().length }}
      </p>
      <button
        type="button"
        class="project-gallery__lightbox-button project-gallery__lightbox-next"
        [attr.aria-label]="'projects-page.gallery.next' | translate"
        (click)="next()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M9 5l7 7-7 7"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>
  }
</dialog>
