@if (intro.introVisible()) {
  <home-intro
    [command]="'home-page.presentation-section.command' | translate"
  />
} @else {
  <div
    class="home-content"
    data-testid="home-content"
    [class.home-content--revealing]="intro.shouldReveal()"
    [style.--home-reveal-duration]="introConfig.revealDurationMs + 'ms'"
    (animationend)="onRevealAnimationEnd($event)"
  >
    <div class="home-page">
      <presentation-section />

      <services-section />

      <tech-stack-section />

      <featured-projects-section />

      <contact-section />
    </div>

    <app-footer />
  </div>
}
