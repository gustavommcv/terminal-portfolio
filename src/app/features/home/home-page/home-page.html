<div class="home-page">
  <app-home-intro
    [commandState]="introCommand.state()"
    [layoutReservation]="introCommand.layoutReservation()"
  >
    @if (intro.contentVisible()) {
      <div class="home-presentation">
        <app-presentation-section />
      </div>
    }
  </app-home-intro>

  @if (intro.contentVisible()) {
    <div
      class="home-content"
      [class.home-content--intro-reveal]="revealLowerContent()"
      data-testid="home-content"
    >
      <app-services-section />

      <app-tech-stack-section />

      <app-featured-projects-section />

      <app-contact-section />
    </div>
  }
</div>

@if (intro.contentVisible()) {
  <app-footer />
}
