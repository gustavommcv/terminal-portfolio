<div class="home-page">
  <home-intro
    [command]="'home-page.presentation-section.command' | translate"
  >
    @if (intro.contentVisible()) {
      <div
        class="home-presentation"
        [class.home-secondary--revealing]="intro.shouldReveal()"
        [style.--home-reveal-duration]="introConfig.revealDurationMs + 'ms'"
      >
        <presentation-section />
      </div>
    }
  </home-intro>

  @if (intro.contentVisible()) {
    <div
      class="home-content"
      data-testid="home-content"
      [class.home-secondary--revealing]="intro.shouldReveal()"
      [style.--home-reveal-duration]="introConfig.revealDurationMs + 'ms'"
      (animationend)="onRevealAnimationEnd($event)"
    >
      <services-section />

      <tech-stack-section />

      <featured-projects-section />

      <contact-section />
    </div>
  }
</div>

@if (intro.contentVisible()) {
  <app-footer
    class="home-footer"
    [class.home-secondary--revealing]="intro.shouldReveal()"
    [style.--home-reveal-duration]="introConfig.revealDurationMs + 'ms'"
  />
}
