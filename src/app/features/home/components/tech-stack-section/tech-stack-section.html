<div class="tech-stack-section">
  <app-terminal-section
    [customTitle]="'home-page.tech-stack-section.title' | translate"
    customCommand="glow stack.md"
    [shortTerminalLine]="true"
  >
    <app-title
      [title]="'home-page.tech-stack-section.title' | translate"
    />

    <ul class="tech-stack-section__list">
      @for (item of 'home-page.tech-stack-section.items' | translate; track $index) {
        <li class="tech-stack-section__item">{{ item }}</li>
      }
    </ul>

    <picture class="tech-stack-section__image-container">
      <source media="(max-width: 1180px)" srcset="images/gopher-s.webp" />
      <img
        class="tech-stack-section__image"
        ngSrc="images/gopher-l.webp"
        alt="Go Gopher"
        width="371"
        height="263"
        decoding="async"
      />
    </picture>
  </app-terminal-section>
</div>
