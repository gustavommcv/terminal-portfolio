@if (badges().length) {
  <ul
    class="project-badges"
    [attr.aria-label]="'projects-page.badges.label' | translate"
  >
    @for (badge of badges(); track badge.slug) {
      <li class="project-badges__item">
        <!-- eslint-disable @angular-eslint/template/prefer-ngsrc -- an SVG sized by its height alone; NgOptimizedImage needs both dimensions -->
        <img
          [src]="badgeSrc(badge)"
          [alt]="badgeAlt(badge)"
          class="project-badges__image"
          height="20"
          loading="lazy"
          decoding="async"
        />
        <!-- eslint-enable @angular-eslint/template/prefer-ngsrc -->
      </li>
    }
  </ul>
}
