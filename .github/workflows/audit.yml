name: Audit

# Known vulnerabilities in what ships to visitors are reported on a schedule, not
# on every pull request, so an advisory published today cannot turn unrelated
# changes red. Dependabot proposes the fixes.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # High and critical advisories fail the run; the lower ones still show in
      # the log.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
